services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: bbs
      POSTGRES_PASSWORD: bbs
      POSTGRES_DB: bbs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  valkey:
    image: valkey/valkey:8
    ports:
      - "6379:6379"
    volumes:
      - valkeydata:/data

volumes:
  pgdata:
  valkeydata:
